<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINIATYR 가구 공방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="아이코닉 가구 100선을 미니어처로. 삼면도·재단표·조립 순서·3D 모델을 축척에 맞춰 만들어 주는 공방.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script>
// 첫 화면이 그려지기 전에 테마를 정한다(저장된 선택이 없거나 '시스템'이면 기기 설정을 따른다)
(function () { var t = 'system'; try { t = (JSON.parse(localStorage.getItem('miniatyr.v1')) || {}).theme || 'system'; } catch (e) {} if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<a class="skip" href="#app">본문으로 건너뛰기</a>
<header class="head" id="head"></header>
<main id="app" tabindex="-1"><div class="wrap loading"><p>공방 문을 여는 중입니다…</p></div></main>
<footer class="foot wrap">
  <p><strong>MINIATYR</strong>는 미니어처 제작을 위한 비공식 팬 프로젝트이며 IKEA와 관련이 없습니다. 제품명은 각 권리자의 상표이고, 실물을 가리키기 위해서만 썼습니다. 치수는 참고용 근사치이고 일부 제품은 단종됐거나 나라마다 판매 여부가 다릅니다. 100개의 순번은 편집 큐레이션이며 공식 판매 순위가 아닙니다.</p>
</footer>
<script type="module" src="src/main.js"></script>
</body>
</html>
